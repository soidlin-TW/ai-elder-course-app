name: CI
on:
  push:
    branches: [main]
  pull_request:
# Read-only token: CI only checks code, it never writes to the repo.
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npx jest --ci
      - run: npm audit --omit=dev --audit-level=critical
